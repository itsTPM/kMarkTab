name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # postinstall runs simple-git-hooks; there is nothing to commit from CI so skip it
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node and pnpm versions come from mise.toml / mise.lock, as locally
      - uses: jdx/mise-action@v5

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - name: Read extension version
        id: version
        run: echo "version=$(node -p "require('./.output/chrome-mv3/manifest.json').version")" >> "$GITHUB_OUTPUT"

      # The artifact is downloaded as a zip of this directory, manifest.json at its root:
      # it can be uploaded to the Chrome Web Store as is
      - uses: actions/upload-artifact@v7
        with:
          name: kmarktab-${{ steps.version.outputs.version }}-chrome
          path: .output/chrome-mv3/
          if-no-files-found: error
